
name: ACEest Fitness Version 2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    name: Build, Lint, and Container Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 1 - Build & Lint (Syntax & Standards)
        run: |
          flake8 . --ignore=W391,W291,W292,W293,E203,W503 --ignore=W391,W291,W292,W293,E203,W503 --ignore=W391,W291,W292,W293,E203,W503 --max-line-length=100

      - name: Stage 2 - Execute Pytest Suite (Host Environment)
        run: |
          pytest -v --cov=app tests/

      - name: Stage 3 - Docker Image Assembly
        run: |
          docker build -t aceest-fitness-gym:${{ github.sha }} .

      - name: Test inside Docker container
        run: docker run --rm aceest-fitness-v2:ci python -m pytest -v tests
