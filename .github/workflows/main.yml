name: ACEest Fitness & Gym CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-lint-test:
    name: Build, Lint, and Container Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py tests

      - name: Stage 1 - Lint
        run: python -m flake8 app.py tests

      - name: Stage 2 - Host Unit Tests
        run: python -m pytest -v --cov=app --cov-report=term-missing tests

      - name: Stage 3 - Docker Image Assembly
        run: docker build -t aceest-fitness:${{ github.sha }} .

      - name: Stage 4 - Containerized Unit Tests
        run: docker run --rm aceest-fitness:${{ github.sha }} python -m pytest -v tests

      - name: Stage 5 - Container Health Check
        run: |
          docker run -d -p 5000:5000 --name aceest-test aceest-fitness:${{ github.sha }}
          trap 'docker rm -f aceest-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl --fail http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs aceest-test
          exit 1
