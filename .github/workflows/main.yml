```yaml
name: ACEest Fitness Version 2 CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: version-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py tests

      - name: Lint
        run: python -m flake8 app.py tests

      - name: Run unit tests
        run: python -m pytest -v --cov=app --cov-report=term-missing tests

      - name: Build Docker image
        run: docker build -t aceest-fitness-v2:ci .

      - name: Test inside Docker container
        run: docker run --rm aceest-fitness-v2:ci python -m pytest -v tests
```