name: ACEest Fitness & Gym CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    name: Build, Lint, and Container Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: version-2

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: version-2/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py tests

      - name: Stage 1 - Lint
        run: python -m flake8 app.py tests

      - name: Stage 2 - Host Unit Tests
        run: python -m pytest -v --cov=app --cov-report=term-missing tests

      - name: Stage 3 - Docker Image Assembly
        run: docker build -t aceest-fitness-v2:${{ github.sha }} .

      - name: Stage 4 - Containerized Unit Tests
        run: docker run --rm aceest-fitness-v2:${{ github.sha }} python -m pytest -v tests

      - name: Stage 5 - Container Health Check
        run: |
          docker run -d -p 5001:5001 --name aceest-v2-test aceest-fitness-v2:${{ github.sha }}
          trap 'docker rm -f aceest-v2-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl --fail http://127.0.0.1:5001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs aceest-v2-test
          exit 1
