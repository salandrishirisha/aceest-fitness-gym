---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-canary
  namespace: aceest
  labels:
    app: aceest-canary
    track: canary
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
    spec:
      containers:
        - name: aceest
          image: IMAGE_REPO:NEW_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DEPLOYMENT_TRACK
              value: "canary"
            - name: ACEEST_DB
              value: /app/data/aceest_fitness.db
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
