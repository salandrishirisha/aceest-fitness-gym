---
# Variant A (control) receives all traffic by default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-a
  namespace: aceest
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-ab-a
                port:
                  number: 5000
---
# Variant B: users with header "X-Variant: B" or cookie "aceest_variant=always"
# always get B; the remaining users are split 50/50.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-b
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
    nginx.ingress.kubernetes.io/canary-by-cookie: "aceest_variant"
    nginx.ingress.kubernetes.io/canary-weight: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-ab-b
                port:
                  number: 5000
